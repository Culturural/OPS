[package]
name = "ops-recorder"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
ops-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
